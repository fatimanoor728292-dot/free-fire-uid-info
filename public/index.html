<!DOCTYPE html>
<html lang="en">
<head>

  <title>Free Fire UID Info</title>

  <style>

      background: #0f1117;
      color: white;

    .container {
      width: 92%;
      max-width: 600px;
      margin: 30px auto;
    }

    .title {
      text-align: center;
      margin-bottom: 25px;
    }

    .title h1 {

      color: #ffcc00;
    }

    .title p {

    .card {

    label {

      color: #ddd;

    }

      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #ffcc00;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #loading {
      display: none;
      text-align: center;
      color: #ffcc00;
      margin: 15px 0;
    }

    #error {
      display: none;
      background: #4b1d1d;
      color: #ffaaaa;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
    }

    #result {
      display: none;
    }

    .profile {
      text-align: center;
    }

    .profile h2 {
      color: #ffcc00;
      margin: 5px 0;
    }

    .uid {
      color: #aaa;
      margin-bottom: 20px;
    }

    .stats {

      grid-template-columns: repeat(2, 1fr);

    }

    .stat {
      background: #252a35;
      padding: 14px;
      border-radius: 10px;

    details {

    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #0b0d12;
      padding: 12px;
      border-radius: 10px;
      overflow-x: auto;
      font-size: 12px;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 25px;
    }
  </style>
</head>

      <div class="stat">

  </div>

  <div class="footer">
    Made with ❤️ by Aziz Jaan
  </div>

</div>

<script>

function getValue(obj, keys) {

  if (!obj || typeof obj !== "object") {
    return null;
  }

  for (const key of keys) {
    if (obj[key] !== undefined && obj[key] !== null) {
      return obj[key];
    }
  }

  return null;
}

function findValue(obj, keys) {

  if (!obj || typeof obj !== "object") {
    return null;
  }

  const direct = getValue(obj, keys);

  if (direct !== null) {
    return direct;
  }

  for (const key in obj) {

    if (
      obj[key] &&
      typeof obj[key] === "object"
    ) {

      const found = findValue(obj[key], keys);

      if (found !== null) {
        return found;
      }
    }
  }

  return null;
}

function show(id, value) {

  document.getElementById(id).textContent =
    value !== null &&
    value !== undefined &&
    value !== ""
      ? value
      : "-";
}
